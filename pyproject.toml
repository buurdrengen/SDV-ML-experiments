[project]
name = "sdv-ml-experiments"
version = "0.1.0"
description = "RL experiments that train agents to play Stardew Valley"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdv_env"]

[tool.pytest.ini_options]
testpaths = ["tests"]
